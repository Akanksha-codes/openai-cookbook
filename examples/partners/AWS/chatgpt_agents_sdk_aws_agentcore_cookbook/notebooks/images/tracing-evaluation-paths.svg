<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" aria-labelledby="title desc" role="img" viewBox="0 0 1280 820"><title id="title">Recommended tracing and evaluation paths</title><desc id="desc">Evaluation runs separately from ChatGPT traffic and is used before promotion. AWS AgentCore Observability is the default trace destination; OpenAI Traces is a separate explicit dual-mode opt-in and not an evaluator. The primary path uses Promptfoo to apply expected-behavior and contract assertions to actual OpenAI Agents SDK test runs. The optional AWS-native path invokes a dedicated non-production evaluation Runtime with approved span-content capture, retrieves its CloudWatch spans, and scores them afterward with Amazon Bedrock AgentCore Evaluations and case-specific ReferenceInputs.</desc><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif}.bg{fill:#fff}.frame,.shared{fill:#fff;stroke:#111;stroke-width:2}.shared{fill:#111}.sharedText{fill:#fff;font-size:16px;font-weight:600}.sharedSmall{fill:#fff;font-size:12px}.optionalBox,.optionalFrame{fill:#fff;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.note{fill:#f4f4f4;stroke:#111;stroke-width:1.5}.label{fill:#111;font-size:15px;font-weight:600}.small{fill:#333;font-size:13px}.noteText{fill:#333;font-size:12px}.caption{fill:#111;font-size:20px;font-weight:700}.subtitle{fill:#555;font-size:13px}.arrow,.dash{stroke:#111;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-width:2;stroke-dasharray:8 6}.legend{font-size:12px;fill:#111}</style><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#111" d="M0,0 L0,6 L9,3 z"/></marker></defs><rect width="1280" height="820" class="bg"/><text x="55" y="48" class="caption">Tracing and evaluation paths</text><text x="55" y="69" class="subtitle">Recommended pre-promotion workflow; evaluation runs separately from user traffic</text><rect width="615" height="54" x="620" y="18" class="frame" rx="7"/><rect width="18" height="18" x="640" y="36" class="shared"/><text x="668" y="50" class="legend">Primary path</text><rect width="18" height="18" x="800" y="36" class="optionalBox"/><text x="828" y="50" class="legend">AWS-native path</text><rect width="18" height="18" x="990" y="36" class="note"/><text x="1018" y="50" class="legend">Observability status</text><rect width="1190" height="72" x="45" y="88" class="note" rx="14"/><text x="70" y="119" class="label">Separate evaluation runs — outside the ChatGPT request path</text><text x="70" y="143" class="small">Use dedicated test cases before promotion; normal end-user requests emit traces but are not synchronously scored.</text><rect width="1190" height="258" x="45" y="190" class="frame" rx="14"/><text x="70" y="222" class="label">Primary — pre-promotion evaluation of actual OpenAI Agents SDK outputs</text><rect width="190" height="78" x="70" y="250" class="shared" rx="9"/><text x="91" y="282" class="sharedText">Versioned test cases</text><text x="96" y="305" class="sharedSmall">Runnable canonical inputs</text><rect width="200" height="78" x="300" y="250" class="shared" rx="9"/><text x="321" y="282" class="sharedText">Promptfoo runner</text><text x="323" y="305" class="sharedSmall">Separate evaluation job</text><rect width="225" height="78" x="540" y="250" class="shared" rx="9"/><text x="564" y="282" class="sharedText">OpenAI Agents SDK</text><text x="566" y="305" class="sharedSmall">Dedicated test invocation</text><rect width="175" height="78" x="805" y="250" class="shared" rx="9"/><text x="838" y="282" class="sharedText">Actual output</text><text x="835" y="305" class="sharedSmall">Response under test</text><rect width="190" height="78" x="1020" y="250" class="shared" rx="9"/><text x="1042" y="278" class="sharedText">Expected behavior</text><text x="1039" y="301" class="sharedText">+ contract report</text><text x="1060" y="318" class="sharedSmall">Promotion evidence</text><path d="M260 289H300" class="arrow"/><path d="M500 289H540" class="arrow"/><path d="M765 289H805" class="arrow"/><path d="M980 289H1020" class="arrow"/><rect width="225" height="78" x="540" y="345" class="note" rx="9"/><text x="571" y="374" class="label">OpenAI Traces (dual only)</text><text x="560" y="401" class="noteText">Observability, not inline scoring or proof</text><path d="M652 328V345" class="arrow"/><rect width="405" height="78" x="805" y="345" class="note" rx="9"/><text x="826" y="372" class="label">Current implementation status</text><text x="826" y="395" class="noteText">Three canonical cases invoke the actual local agent.</text><text x="826" y="413" class="noteText">Contract + exact expected behavior are scored afterward.</text><rect width="1190" height="212" x="45" y="478" class="optionalFrame" rx="14"/><text x="70" y="510" class="label">Optional AWS-native — deployed-Runtime validation</text><rect width="185" height="78" x="70" y="540" class="optionalBox" rx="9"/><text x="92" y="572" class="label">AWS-tagged cases</text><text x="99" y="595" class="small">Canonical test inputs</text><rect width="240" height="78" x="295" y="540" class="optionalBox" rx="9"/><text x="337" y="565" class="label">Dedicated evaluation</text><text x="354" y="585" class="label">AgentCore Runtime</text><text x="334" y="605" class="noteText">Approved span-content capture</text><rect width="210" height="78" x="575" y="540" class="optionalBox" rx="9"/><text x="595" y="572" class="label">CloudWatch session spans</text><text x="618" y="595" class="small">Completed trace evidence</text><rect width="220" height="78" x="825" y="540" class="optionalBox" rx="9"/><text x="879" y="568" class="label">Amazon Bedrock</text><text x="858" y="591" class="label">AgentCore Evaluations</text><text x="891" y="608" class="noteText">Post-run scoring</text><rect width="125" height="78" x="1085" y="540" class="optionalBox" rx="9"/><text x="1104" y="572" class="label">Scores and</text><text x="1109" y="595" class="label">evidence</text><path d="M255 579H295" class="dash"/><path d="M535 579H575" class="dash"/><path d="M785 579H825" class="dash"/><path d="M1045 579H1085" class="dash"/><path d="M162 618V650H935V618" class="dash"/><text x="475" y="675" class="noteText">ReferenceInputs: expected response + assertions + trajectory</text><rect width="1140" height="90" x="70" y="700" class="note" rx="9"/><text x="93" y="729" class="label">When the checks run</text><text x="93" y="753" class="small">The primary local evaluation can run before deployment. AgentCore Evaluations require a dedicated non-production evaluation Runtime.</text><text x="93" y="776" class="small">Both are separate pre-promotion checks: tracing occurs during each test invocation, and scoring happens afterward.</text></svg>