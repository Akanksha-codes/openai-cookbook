<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" aria-labelledby="title description" role="img" viewBox="0 0 1440 964"><title id="title">Bulk document review workflow</title><desc id="description">User to Review command: Submit document folder. Review command to Agents API: Create multi-agent session. Review command to Input / output folders: Mount input + policy read-only; output writable. Agents API to Specialist subagents: Delegate each document. Specialist subagents to Mounted review skill: Discover and apply policy. Specialist subagents to Input / output folders: Write individual JSON reports. Agents API to Input / output folders: Write consolidated summary. Review command to User: Return findings for review.</desc><defs><marker id="arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#253443" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs><rect width="1440" height="964" fill="#FFF"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="46" fill="#162231" font-size="26" font-weight="600" text-anchor="start"><tspan x="24" dy="0">Bulk document review</tspan></text><rect width="220.333" height="805.8" x="24" y="80" fill="#F4F5F6"/><rect width="220.333" height="78" x="24" y="80" fill="#E4E6E9"/><text x="134.167" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="134.167" dy="0">User</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 134.16666666666669 158 V 885.8000000000002"/><rect width="220.333" height="805.8" x="258.333" y="80" fill="#EDF7FE"/><rect width="220.333" height="78" x="258.333" y="80" fill="#CCE6FA"/><text x="368.5" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="368.5" dy="0">Review command</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 368.5 158 V 885.8000000000002"/><rect width="220.333" height="805.8" x="492.667" y="80" fill="#EEFBF3"/><rect width="220.333" height="78" x="492.667" y="80" fill="#CDF2DB"/><text x="602.833" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="602.833" dy="0">Agents API</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 602.8333333333334 158 V 885.8000000000002"/><rect width="220.333" height="805.8" x="727" y="80" fill="#EEFBF3"/><rect width="220.333" height="78" x="727" y="80" fill="#CDF2DB"/><text x="837.167" y="110.1" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="837.167" dy="0">Specialist</tspan><tspan x="837.167" dy="29.9">subagents</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 837.1666666666667 158 V 378.4"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 837.1666666666667 411 V 710.0000000000001"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 837.1666666666667 742.6000000000001 V 885.8000000000002"/><rect width="220.333" height="805.8" x="961.333" y="80" fill="#EDF7FE"/><rect width="220.333" height="78" x="961.333" y="80" fill="#CCE6FA"/><text x="1071.5" y="110.1" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="1071.5" dy="0">Mounted review</tspan><tspan x="1071.5" dy="29.9">skill</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 1071.5 158 V 641.4000000000001"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 1071.5 674.0000000000001 V 710.0000000000001"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 1071.5 742.6000000000001 V 885.8000000000002"/><rect width="220.333" height="805.8" x="1195.667" y="80" fill="#FFFCED"/><rect width="220.333" height="78" x="1195.667" y="80" fill="#FFF0B3"/><text x="1305.833" y="110.1" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="1305.833" dy="0">Input / output</tspan><tspan x="1305.833" dy="29.9">folders</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 1305.8333333333335 158 V 885.8000000000002"/><g data-from="0" data-to="1"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 134.16666666666669 251.2 H 368.5"/><text x="251.333" y="208" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="251.333" dy="0">Submit document</tspan><tspan x="251.333" dy="28.6">folder</tspan></text></g><g data-from="1" data-to="2"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 368.5 348.4 H 602.8333333333334"/><text x="485.667" y="305.2" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="485.667" dy="0">Create multi-agent</tspan><tspan x="485.667" dy="28.6">session</tspan></text></g><g data-from="1" data-to="5"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 368.5 417 H 1305.8333333333335"/><text x="837.167" y="402.4" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="837.167" dy="0">Mount input + policy read-only; output writable</tspan></text></g><g data-from="2" data-to="3"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 514.2 H 837.1666666666667"/><text x="720" y="471" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="720" dy="0">Delegate each</tspan><tspan x="720" dy="28.6">document</tspan></text></g><g data-from="3" data-to="4"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 837.1666666666667 611.4000000000001 H 1071.5"/><text x="954.333" y="568.2" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="954.333" dy="0">Discover and apply</tspan><tspan x="954.333" dy="28.6">policy</tspan></text></g><g data-from="3" data-to="5"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 837.1666666666667 680.0000000000001 H 1305.8333333333335"/><text x="1071.5" y="665.4" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="1071.5" dy="0">Write individual JSON reports</tspan></text></g><g data-from="2" data-to="5"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 748.6000000000001 H 1305.8333333333335"/><text x="954.333" y="734" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="954.333" dy="0">Write consolidated summary</tspan></text></g><g data-from="1" data-to="0"><path fill="none" stroke="#253443" stroke-dasharray="7 5" stroke-width="1.6" marker-end="url(#arrow)" d="M 368.5 845.8000000000002 H 134.16666666666669"/><text x="251.333" y="802.6" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="251.333" dy="0">Return findings for</tspan><tspan x="251.333" dy="28.6">review</tspan></text></g><text x="24" y="930.8" fill="#4D5B6A" font-size="17" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Specialists share one sandbox; findings still require human review.</tspan></text></g></svg>