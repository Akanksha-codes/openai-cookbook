<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="867" aria-labelledby="title description" role="img" viewBox="0 0 1440 867"><title id="title">GitHub issue investigator workflow</title><desc id="description">User to GitHub: Open an issue. GitHub to Webhook receiver: Signed issues.opened webhook. Webhook receiver to Agents API: Create self-hosted session. Webhook receiver to Sandbox: Clone repository and start executor. Agents API to Sandbox: Inspect code and reproduce bug. Agents API to Webhook receiver: Root cause and suggested fix. Webhook receiver to GitHub: Post investigation comment.</desc><defs><marker id="arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#253443" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs><rect width="1440" height="867" fill="#FFF"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="46" fill="#162231" font-size="26" font-weight="600" text-anchor="start"><tspan x="24" dy="0">GitHub issue investigator</tspan></text><rect width="267.2" height="708.6" x="24" y="80" fill="#F4F5F6"/><rect width="267.2" height="78" x="24" y="80" fill="#E4E6E9"/><text x="157.6" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="157.6" dy="0">User</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 157.6 158 V 788.6000000000001"/><rect width="267.2" height="708.6" x="305.2" y="80" fill="#EDF7FE"/><rect width="267.2" height="78" x="305.2" y="80" fill="#CCE6FA"/><text x="438.8" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="438.8" dy="0">GitHub</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 438.79999999999995 158 V 788.6000000000001"/><rect width="267.2" height="708.6" x="586.4" y="80" fill="#EDF7FE"/><rect width="267.2" height="78" x="586.4" y="80" fill="#CCE6FA"/><text x="720" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="720" dy="0">Webhook receiver</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 720 158 V 788.6000000000001"/><rect width="267.2" height="708.6" x="867.6" y="80" fill="#EEFBF3"/><rect width="267.2" height="78" x="867.6" y="80" fill="#CDF2DB"/><text x="1001.2" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="1001.2" dy="0">Agents API</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 1001.1999999999999 158 V 418.40000000000003"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 1001.1999999999999 451.00000000000006 V 788.6000000000001"/><rect width="267.2" height="708.6" x="1148.8" y="80" fill="#FFFCED"/><rect width="267.2" height="78" x="1148.8" y="80" fill="#FFF0B3"/><text x="1282.4" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="1282.4" dy="0">Sandbox</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 1282.3999999999999 158 V 788.6000000000001"/><g data-from="0" data-to="1"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 157.6 222.6 H 438.79999999999995"/><text x="298.2" y="208" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="298.2" dy="0">Open an issue</tspan></text></g><g data-from="1" data-to="2"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 438.79999999999995 319.8 H 720"/><text x="579.4" y="276.6" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="579.4" dy="0">Signed issues.opened</tspan><tspan x="579.4" dy="28.6">webhook</tspan></text></g><g data-from="2" data-to="3"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 720 388.40000000000003 H 1001.1999999999999"/><text x="860.6" y="373.8" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="860.6" dy="0">Create self-hosted session</tspan></text></g><g data-from="2" data-to="4"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 720 457.00000000000006 H 1282.3999999999999"/><text x="1001.2" y="442.4" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="1001.2" dy="0">Clone repository and start executor</tspan></text></g><g data-from="3" data-to="4"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 1001.1999999999999 554.2 H 1282.3999999999999"/><text x="1141.8" y="511" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="1141.8" dy="0">Inspect code and</tspan><tspan x="1141.8" dy="28.6">reproduce bug</tspan></text></g><g data-from="3" data-to="2"><path fill="none" stroke="#253443" stroke-dasharray="7 5" stroke-width="1.6" marker-end="url(#arrow)" d="M 1001.1999999999999 651.4000000000001 H 720"/><text x="860.6" y="608.2" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="860.6" dy="0">Root cause and</tspan><tspan x="860.6" dy="28.6">suggested fix</tspan></text></g><g data-from="2" data-to="1"><path fill="none" stroke="#253443" stroke-dasharray="7 5" stroke-width="1.6" marker-end="url(#arrow)" d="M 720 748.6000000000001 H 438.79999999999995"/><text x="579.4" y="705.4" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="579.4" dy="0">Post investigation</tspan><tspan x="579.4" dy="28.6">comment</tspan></text></g><text x="24" y="833.6" fill="#4D5B6A" font-size="17" font-weight="400" text-anchor="start"><tspan x="24" dy="0">The application posts the findings; the agent does not merge or deploy changes.</tspan></text></g></svg>