<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1715" aria-labelledby="title description" role="img" viewBox="0 0 1440 1715"><title id="title">SRE agent workflow</title><desc id="description">Incident alerts to Incident bot: Send incident. Incident bot to Slack #oncall: Open incident thread. Incident bot to Agents API: Create incident session. Incident bot to Incident sandbox: Start executor + AWS skills. Agents API to Incident sandbox: Read skills + runbook. Agents API to Evidence + history: Inspect code, AWS + history. Evidence + history to Agents API: Return correlated evidence. Agents API to Incident bot: Action-required webhook. Incident bot to Agents API: Fetch pending tool call. Incident bot to Slack #oncall: Post approval buttons. Slack #oncall to Incident bot: Approve or reject. Incident bot to Agents API: Submit decision. Agents API to Slack #oncall: Explain next steps. Slack #oncall to Incident bot: Ask a follow-up. Incident bot to Agents API: Continue same session. Incident bot to Incident bot: Save incident memory. Incident bot to Agents API: Delete session. Incident bot to Incident sandbox: Remove sandbox.</desc><defs><marker id="arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#253443" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs><rect width="1440" height="1715" fill="#FFF"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="46" fill="#162231" font-size="26" font-weight="600" text-anchor="start"><tspan x="24" dy="0">SRE agent</tspan></text><rect width="220.333" height="1556.4" x="24" y="80" fill="#F4F5F6"/><rect width="220.333" height="78" x="24" y="80" fill="#E4E6E9"/><text x="134.167" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="134.167" dy="0">Incident alerts</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 134.16666666666669 158 V 1636.3999999999999"/><rect width="220.333" height="1556.4" x="258.333" y="80" fill="#EDF7FE"/><rect width="220.333" height="78" x="258.333" y="80" fill="#CCE6FA"/><text x="368.5" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="368.5" dy="0">Slack #oncall</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 368.5 158 V 184"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 368.5 216.6 V 1636.3999999999999"/><rect width="220.333" height="1556.4" x="492.667" y="80" fill="#EDF7FE"/><rect width="220.333" height="78" x="492.667" y="80" fill="#CCE6FA"/><text x="602.833" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="602.833" dy="0">Incident bot</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 602.8333333333334 158 V 1121.6000000000001"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 602.8333333333334 1154.2 V 1356"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 602.8333333333334 1417.2 V 1636.3999999999999"/><rect width="220.333" height="1556.4" x="727" y="80" fill="#EEFBF3"/><rect width="220.333" height="78" x="727" y="80" fill="#CDF2DB"/><text x="837.167" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="837.167" dy="0">Agents API</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 837.1666666666667 158 V 418.4"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 837.1666666666667 451 V 1557.8"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 837.1666666666667 1590.3999999999999 V 1636.3999999999999"/><rect width="220.333" height="1556.4" x="961.333" y="80" fill="#FFFCED"/><rect width="220.333" height="78" x="961.333" y="80" fill="#FFF0B3"/><text x="1071.5" y="125.05" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="1071.5" dy="0">Incident sandbox</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 1071.5 158 V 555.6"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 1071.5 588.2 V 624.2"/><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 1071.5 656.8000000000001 V 1636.3999999999999"/><rect width="220.333" height="1556.4" x="1195.667" y="80" fill="#EDF7FE"/><rect width="220.333" height="78" x="1195.667" y="80" fill="#CCE6FA"/><text x="1305.833" y="110.1" fill="#162231" font-size="23" font-weight="600" text-anchor="middle"><tspan x="1305.833" dy="0">Evidence +</tspan><tspan x="1305.833" dy="29.9">history</tspan></text><path fill="none" stroke="#A8B3BC" stroke-dasharray="6 6" stroke-width="1" d="M 1305.8333333333335 158 V 1636.3999999999999"/><g data-from="0" data-to="2"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 134.16666666666669 222.6 H 602.8333333333334"/><text x="368.5" y="208" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="368.5" dy="0">Send incident</tspan></text></g><g data-from="2" data-to="1"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 291.2 H 368.5"/><text x="485.667" y="276.6" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="485.667" dy="0">Open incident thread</tspan></text></g><g data-from="2" data-to="3"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 388.4 H 837.1666666666667"/><text x="720" y="345.2" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="720" dy="0">Create incident</tspan><tspan x="720" dy="28.6">session</tspan></text></g><g data-from="2" data-to="4"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 457 H 1071.5"/><text x="837.167" y="442.4" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="837.167" dy="0">Start executor + AWS skills</tspan></text></g><g data-from="3" data-to="4"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 837.1666666666667 525.6 H 1071.5"/><text x="954.333" y="511" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="954.333" dy="0">Read skills + runbook</tspan></text></g><g data-from="3" data-to="5"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 837.1666666666667 594.2 H 1305.8333333333335"/><text x="1071.5" y="579.6" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="1071.5" dy="0">Inspect code, AWS + history</tspan></text></g><g data-from="5" data-to="3"><path fill="none" stroke="#253443" stroke-dasharray="7 5" stroke-width="1.6" marker-end="url(#arrow)" d="M 1305.8333333333335 662.8000000000001 H 837.1666666666667"/><text x="1071.5" y="648.2" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="1071.5" dy="0">Return correlated evidence</tspan></text></g><g data-from="3" data-to="2"><path fill="none" stroke="#253443" stroke-dasharray="7 5" stroke-width="1.6" marker-end="url(#arrow)" d="M 837.1666666666667 760.0000000000001 H 602.8333333333334"/><text x="720" y="716.8" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="720" dy="0">Action-required</tspan><tspan x="720" dy="28.6">webhook</tspan></text></g><g data-from="2" data-to="3"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 857.2000000000002 H 837.1666666666667"/><text x="720" y="814" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="720" dy="0">Fetch pending tool</tspan><tspan x="720" dy="28.6">call</tspan></text></g><g data-from="2" data-to="1"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 954.4000000000002 H 368.5"/><text x="485.667" y="911.2" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="485.667" dy="0">Post approval</tspan><tspan x="485.667" dy="28.6">buttons</tspan></text></g><g data-from="1" data-to="2"><path fill="none" stroke="#253443" stroke-dasharray="7 5" stroke-width="1.6" marker-end="url(#arrow)" d="M 368.5 1023.0000000000002 H 602.8333333333334"/><text x="485.667" y="1008.4" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="485.667" dy="0">Approve or reject</tspan></text></g><g data-from="2" data-to="3"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 1091.6000000000001 H 837.1666666666667"/><text x="720" y="1077" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="720" dy="0">Submit decision</tspan></text></g><g data-from="3" data-to="1"><path fill="none" stroke="#253443" stroke-dasharray="7 5" stroke-width="1.6" marker-end="url(#arrow)" d="M 837.1666666666667 1160.2 H 368.5"/><text x="602.833" y="1145.6" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="602.833" dy="0">Explain next steps</tspan></text></g><g data-from="1" data-to="2"><path fill="none" stroke="#253443" stroke-dasharray="7 5" stroke-width="1.6" marker-end="url(#arrow)" d="M 368.5 1228.8 H 602.8333333333334"/><text x="485.667" y="1214.2" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="485.667" dy="0">Ask a follow-up</tspan></text></g><g data-from="2" data-to="3"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 1326 H 837.1666666666667"/><text x="720" y="1282.8" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="720" dy="0">Continue same</tspan><tspan x="720" dy="28.6">session</tspan></text></g><g data-from="2" data-to="2"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 1423.2 H 666.8333333333334 V 1455.2 H 602.8333333333334"/><text x="602.833" y="1380" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="602.833" dy="0">Save incident</tspan><tspan x="602.833" dy="28.6">memory</tspan></text></g><g data-from="2" data-to="3"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 1527.8 H 837.1666666666667"/><text x="720" y="1513.2" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="720" dy="0">Delete session</tspan></text></g><g data-from="2" data-to="4"><path fill="none" stroke="#253443" stroke-width="1.6" marker-end="url(#arrow)" d="M 602.8333333333334 1596.3999999999999 H 1071.5"/><text x="837.167" y="1581.8" fill="#162231" font-size="22" font-weight="400" text-anchor="middle"><tspan x="837.167" dy="0">Remove sandbox</tspan></text></g><text x="24" y="1681.4" fill="#4D5B6A" font-size="17" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Approval records a decision, not a rollback. Incident memory is application-owned.</tspan></text></g></svg>